<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link
			rel="icon"
			type="image/x-icon"
			href="https://lunch-app.simform.solutions/Images/favicon.ico"
		/>
		<link rel="stylesheet" href="style.css" />
		<link
			rel="stylesheet"
			href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
			integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
			crossorigin="anonymous"
			referrerpolicy="no-referrer"
		/>

		<!-- <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script> -->
		<title>CSV Data Explorer</title>
	</head>
	<body>
		<!-- Taking file as input -->
		<input type="file" name="dataset" id="dataset" />
		<button id="submitBtn">Submit</button>
		<input
			type="text"
			placeholder="Enter Search Query"
			id="filter"
			name="filter"
		/>
		<button id="filterSubmit">Filter</button>
		<button id="resetFilter">Reset</button>
		<h1>This is the text Element</h1>
		<select name="rowsCount" id="rowsCount">
			<option value="10">10</option>
			<option value="50">50</option>
			<option value="100">100</option>
		</select>
		<button id="previous">Prev</button>
		<button id="next">Next</button>
		<table id="showData"></table>
		<script src="script.js"></script>
	</body>
</html>
